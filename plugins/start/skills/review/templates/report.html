<!DOCTYPE html>
<!--
  Interactive Code Review Report — template for the review skill.

  Usage (by the skill):
  1. Build the review JSON per the SKILL.md Interface section:
     {
       meta:     { title, mode: "Scoped"|"Audit", target, date, verdict, verdictReasoning },
       summary:  { critical, high, medium, low },
       findings: [{ id, severity, confidence, source, file, line, title, consequence,
                    remediation, codeBefore?, codeAfter? }],
       accepted: [{ smell, location, reasoning }],
       proxies:  { orientation, dependencyArrows, amplification, coChange,
                   blastRadius, responsibilities },        // audit mode only
       refactors:[{ rank, what, why, migration: [] }],     // audit mode only
       strengths:[ "..." ]
     }
  2. JSON-encode it, escaping every "<" as the six characters \u003c (prevents a
     literal closing-script sequence inside code snippets from truncating the data block).
  3. Replace the placeholder token inside the review-data script tag below with that JSON.
     The token is the only content of that tag and occurs nowhere else in this file.
  4. Verify: no placeholder token remains and the file opens in a browser.

  The page is fully self-contained: no network requests, works offline and in CI artifacts.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code Review Report</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1a2233; --muted: #5b6577;
    --border: #e2e6ec; --accent: #3b5bdb; --code-bg: #f0f2f6;
    --critical: #c92a2a; --high: #e8590c; --medium: #b08b00; --low: #6b7280;
    --ok: #2b8a3e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c; --panel: #1a1f2a; --text: #e5e9f0; --muted: #98a2b3;
      --border: #2a3140; --accent: #748ffc; --code-bg: #141824;
      --critical: #ff6b6b; --high: #ffa94d; --medium: #ffd43b; --low: #9aa4b2;
      --ok: #69db7c;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 20px 80px; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline; }
  h1 { font-size: 22px; margin: 0; }
  .meta { color: var(--muted); font-size: 13px; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px;
           font-size: 12px; font-weight: 600; letter-spacing: .02em; }
  .badge.verdict { font-size: 13px; }
  .v-approve { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
  .v-comments { background: color-mix(in srgb, var(--medium) 18%, transparent); color: var(--medium); }
  .v-changes { background: color-mix(in srgb, var(--critical) 15%, transparent); color: var(--critical); }
  .counts { display: flex; gap: 10px; margin: 18px 0; flex-wrap: wrap; }
  .count { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
           padding: 10px 16px; min-width: 92px; }
  .count b { font-size: 22px; display: block; }
  .count span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .count.critical b { color: var(--critical); } .count.high b { color: var(--high); }
  .count.medium b { color: var(--medium); } .count.low b { color: var(--low); }
  .verdict-p { background: var(--panel); border: 1px solid var(--border); border-left: 4px solid var(--accent);
               border-radius: 10px; padding: 14px 18px; margin: 6px 0 20px; }
  nav.tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--border); margin-bottom: 18px; flex-wrap: wrap; }
  nav.tabs button { border: 0; background: none; color: var(--muted); font: inherit; font-weight: 600;
                    padding: 9px 14px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; }
  nav.tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
  .chip { border: 1px solid var(--border); background: var(--panel); color: var(--muted); border-radius: 999px;
          padding: 4px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .chip.on { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  input[type=search], select { background: var(--panel); color: var(--text); border: 1px solid var(--border);
          border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 13px; }
  input[type=search] { flex: 1; min-width: 160px; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border);
          border-radius: 10px; overflow: hidden; font-size: 14px; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted);
       cursor: pointer; user-select: none; white-space: nowrap; }
  th .dir { opacity: .6; }
  tr.frow { cursor: pointer; }
  tr.frow:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); }
  tr.detail td { background: var(--code-bg); }
  .sev { font-weight: 700; font-size: 12px; }
  .sev.CRITICAL { color: var(--critical); } .sev.HIGH { color: var(--high); }
  .sev.MEDIUM { color: var(--medium); } .sev.LOW { color: var(--low); }
  code, pre { font: 12.5px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  code.loc { color: var(--muted); }
  pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px;
        padding: 10px 12px; overflow-x: auto; margin: 6px 0; }
  .lbl { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
         color: var(--muted); margin-top: 8px; }
  .cardlist { display: grid; gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; }
  .card h3 { margin: 0 0 4px; font-size: 15px; }
  .card ol { margin: 6px 0 0 18px; padding: 0; }
  h2.sec { font-size: 16px; margin: 26px 0 10px; }
  .empty { color: var(--muted); font-style: italic; padding: 14px 4px; }
  .arrow { color: var(--critical); font-weight: 700; }
  .flag { color: var(--critical); font-weight: 600; }
  ul.strengths { margin: 8px 0 0; padding-left: 20px; }
  footer { margin-top: 40px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<script id="review-data" type="application/json">__REVIEW_DATA__</script>
<div class="wrap" id="app"></div>
<script>
"use strict";
let DATA = {};
try { DATA = JSON.parse(document.getElementById("review-data").textContent); }
catch (e) { /* data not injected yet — render an empty report, never a blank page */ }
const SEVS = ["CRITICAL", "HIGH", "MEDIUM", "LOW"];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const el = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstChild; };

const state = { tab: "findings", sevOn: new Set(SEVS), source: "", q: "", sortKey: "rank", sortDir: 1, open: new Set() };

function verdictClass(v) {
  v = (v || "").toUpperCase();
  if (v.includes("REQUEST")) return "v-changes";
  if (v.includes("COMMENT")) return "v-comments";
  return "v-approve";
}
function sevRank(s) { return SEVS.indexOf(s); }

function render() {
  const m = DATA.meta || {};
  const s = DATA.summary || {};
  const isAudit = (m.mode || "").toLowerCase() === "audit";
  const tabs = [["findings", "Findings"]];
  if (isAudit && DATA.proxies) tabs.push(["arch", "Architecture"]);
  tabs.push(["accepted", "Contextually Acceptable"]);
  if (isAudit && (DATA.refactors || []).length) tabs.push(["refactors", "Refactors"]);

  document.title = m.title || "Code Review Report";
  const app = document.getElementById("app");
  app.innerHTML = `
    <header>
      <h1>${esc(m.title || "Code Review Report")}</h1>
      ${m.verdict ? `<span class="badge verdict ${verdictClass(m.verdict)}">${esc(m.verdict)}</span>` : ""}
      ${[m.mode, m.target, m.date].some(Boolean)
        ? `<span class="meta">${[m.mode, m.target, m.date].filter(Boolean).map(esc).join(" · ")}</span>` : ""}
    </header>
    <div class="counts">
      ${SEVS.map(k => `<div class="count ${k.toLowerCase()}"><b>${s[k.toLowerCase()] ?? 0}</b><span>${k}</span></div>`).join("")}
    </div>
    ${m.verdictReasoning ? `<div class="verdict-p">${esc(m.verdictReasoning)}</div>` : ""}
    <nav class="tabs">${tabs.map(([id, label]) =>
      `<button data-tab="${id}" class="${state.tab === id ? "active" : ""}">${label}</button>`).join("")}</nav>
    <main id="tabbody"></main>
    ${(DATA.strengths || []).length ? `<h2 class="sec">Strengths</h2>
      <ul class="strengths">${DATA.strengths.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
    <footer>Generated by the review skill${m.date ? " · " + esc(m.date) : ""}</footer>`;
  app.querySelectorAll("nav.tabs button").forEach(b =>
    b.onclick = () => { state.tab = b.dataset.tab; render(); });
  const body = document.getElementById("tabbody");
  if (state.tab === "findings") renderFindings(body);
  else if (state.tab === "arch") renderArch(body);
  else if (state.tab === "accepted") renderAccepted(body);
  else if (state.tab === "refactors") renderRefactors(body);
}

function renderFindings(root) {
  const sources = [...new Set((DATA.findings || []).map(f => f.source).filter(Boolean))];
  root.appendChild(el(`<div class="controls">
    ${SEVS.map(k => `<button class="chip ${state.sevOn.has(k) ? "on" : ""}" data-sev="${k}">${k}</button>`).join("")}
    ${sources.length > 1 ? `<select id="srcSel"><option value="">All sources</option>
      ${sources.map(x => `<option ${state.source === x ? "selected" : ""}>${esc(x)}</option>`).join("")}</select>` : ""}
    <input type="search" id="q" placeholder="Search title, file, consequence…" value="${esc(state.q)}">
  </div>`));
  root.querySelectorAll(".chip").forEach(c => c.onclick = () => {
    const k = c.dataset.sev;
    state.sevOn.has(k) ? state.sevOn.delete(k) : state.sevOn.add(k); render();
  });
  const srcSel = root.querySelector("#srcSel");
  if (srcSel) srcSel.onchange = e => { state.source = e.target.value; render(); };
  const q = root.querySelector("#q");
  q.oninput = e => { state.q = e.target.value; drawRows(); };

  const cols = [["id", "ID"], ["severity", "Severity"], ["confidence", "Conf."],
                ["source", "Source"], ["title", "Finding"], ["file", "Location"]];
  const table = el(`<table><thead><tr>${cols.map(([k, l]) =>
    `<th data-k="${k}">${l} <span class="dir">${state.sortKey === k ? (state.sortDir > 0 ? "▲" : "▼") : ""}</span></th>`
  ).join("")}</tr></thead><tbody></tbody></table>`);
  table.querySelectorAll("th").forEach(th => th.onclick = () => {
    const k = th.dataset.k;
    state.sortDir = state.sortKey === k ? -state.sortDir : 1;
    state.sortKey = k; render();
  });
  root.appendChild(table);
  const tbody = table.querySelector("tbody");

  function filtered() {
    const needle = state.q.toLowerCase();
    let rows = (DATA.findings || []).filter(f =>
      state.sevOn.has(f.severity) &&
      (!state.source || f.source === state.source) &&
      (!needle || [f.title, f.file, f.consequence, f.remediation, f.id]
        .join(" ").toLowerCase().includes(needle)));
    const k = state.sortKey;
    rows.sort((a, b) => {
      let va = k === "severity" ? sevRank(a.severity) : k === "rank" ? 0 : (a[k] ?? "");
      let vb = k === "severity" ? sevRank(b.severity) : k === "rank" ? 0 : (b[k] ?? "");
      if (k === "rank") { va = sevRank(a.severity); vb = sevRank(b.severity); }
      return (va < vb ? -1 : va > vb ? 1 : 0) * state.sortDir;
    });
    return rows;
  }
  function drawRows() {
    const rows = filtered();
    tbody.innerHTML = rows.length ? "" : `<tr><td colspan="6" class="empty">No findings match the filters.</td></tr>`;
    for (const f of rows) {
      const key = f.id;
      const tr = el(`<tr class="frow">
        <td><b>${esc(f.id)}</b></td>
        <td><span class="sev ${esc(f.severity)}">${esc(f.severity)}</span></td>
        <td>${esc(f.confidence || "")}</td>
        <td>${esc(f.source || "")}</td>
        <td>${esc(f.title)}</td>
        <td><code class="loc">${esc(f.file)}${f.line ? ":" + esc(f.line) : ""}</code></td></tr>`);
      tr.onclick = () => { state.open.has(key) ? state.open.delete(key) : state.open.add(key); drawRows(); };
      tbody.appendChild(tr);
      if (state.open.has(key)) {
        tbody.appendChild(el(`<tr class="detail"><td colspan="6">
          <div class="lbl">Consequence</div><div>${esc(f.consequence)}</div>
          <div class="lbl">Remediation</div><div>${esc(f.remediation)}</div>
          ${f.codeBefore ? `<div class="lbl">Before</div><pre>${esc(f.codeBefore)}</pre>` : ""}
          ${f.codeAfter ? `<div class="lbl">After</div><pre>${esc(f.codeAfter)}</pre>` : ""}
        </td></tr>`));
      }
    }
  }
  drawRows();
}

function simpleTable(root, title, headers, rows) {
  root.appendChild(el(`<h2 class="sec">${esc(title)}</h2>`));
  if (!rows.length) { root.appendChild(el(`<div class="empty">None reported.</div>`)); return; }
  root.appendChild(el(`<table><thead><tr>${headers.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`));
}

function renderArch(root) {
  const p = DATA.proxies || {};
  const o = p.orientation || {};
  root.appendChild(el(`<div class="card">
    <h3>Orientation</h3>
    <div><b>System:</b> ${esc(o.does || "—")}</div>
    <div><b>Core concepts:</b> ${esc(o.concepts || "—")}</div>
    <div><b>Volatile:</b> ${esc(o.volatile || "—")} · <b>Stable:</b> ${esc(o.stable || "—")}</div>
  </div>`));
  simpleTable(root, "Wrong-Way Dependency Arrows (stable → volatile)",
    ["From", "", "To", "Location", "Why it hurts"],
    (p.dependencyArrows || []).map(a =>
      [esc(a.from), `<span class="arrow">→</span>`, esc(a.to), `<code class="loc">${esc(a.location)}</code>`, esc(a.note)]));
  simpleTable(root, "Change Amplification",
    ["Scenario", "Files touched", "Verdict"],
    (p.amplification || []).map(a =>
      [esc(a.scenario), `<b>${(a.files || []).length}</b><br><code class="loc">${(a.files || []).map(esc).join("<br>")}</code>`, esc(a.verdict)]));
  simpleTable(root, "Co-Change Archaeology",
    ["File set", "Commits together", "Crosses module boundary"],
    (p.coChange || []).map(c =>
      [`<code class="loc">${(c.files || []).map(esc).join("<br>")}</code>`, esc(c.commits),
       c.crossesBoundary ? `<span class="flag">yes — boundary contradicts reality</span>` : "no"]));
  simpleTable(root, "Blast Radius (highest fan-in)",
    ["Module", "Fan-in", "Dependents", "Interface stable?"],
    (p.blastRadius || []).map(b =>
      [esc(b.module), esc(b.fanIn), esc(b.dependents), b.stable ? "yes" : `<span class="flag">no</span>`]));
  simpleTable(root, "Module Responsibilities (explainability)",
    ["Module", "One-sentence responsibility", "Flag"],
    (p.responsibilities || []).map(r =>
      [esc(r.module), esc(r.sentence), r.flagged ? `<span class="flag">needs “and” / name mismatch</span>` : ""]));
}

function renderAccepted(root) {
  root.appendChild(el(`<p class="meta">Catalog smells deliberately not flagged — each with the reasoning.
    This list is part of calibration, not an afterthought.</p>`));
  simpleTable(root, "Contextually Acceptable", ["Smell", "Location", "Reasoning"],
    (DATA.accepted || []).map(a =>
      [esc(a.smell), `<code class="loc">${esc(a.location)}</code>`, esc(a.reasoning)]));
}

function renderRefactors(root) {
  root.appendChild(el(`<div class="cardlist">${(DATA.refactors || [])
    .slice().sort((a, b) => (a.rank ?? 9) - (b.rank ?? 9))
    .map(r => `<div class="card">
      <h3>#${esc(r.rank)} — ${esc(r.what)}</h3>
      <div class="meta">${esc(r.why)}</div>
      <div class="lbl">Incremental migration</div>
      <ol>${(r.migration || []).map(s => `<li>${esc(s)}</li>`).join("")}</ol>
    </div>`).join("")}</div>`));
}

render();
</script>
</body>
</html>
